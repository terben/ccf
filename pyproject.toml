[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schurcorr"
version = "0.1.0"
description = "Companion code for Schur/PACF coordinates of constrained correlation functions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Thomas Erben" }
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "sympy"
]

[project.optional-dependencies]
test = [
    "pytest",
    "statsmodels"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["schurcorr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
