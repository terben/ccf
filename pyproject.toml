[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccf"
version = "1.0.0"
description = "Companion code for the paper 'Natural coordinates for constrained correlation functions'"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Thomas Erben" }
]
dependencies = [
    "numpy"
]

[project.urls]
Repository = "https://github.com/terben/ccf"
Issues = "https://github.com/terben/ccf/issues"

[project.optional-dependencies]
plots = [
    "matplotlib",
    "scipy"
]
symbolic = [
    "sympy"
]
precision = [
    "mpmath"
]
test = [
    "pytest",
    "statsmodels",
    "ccf[plots,symbolic,precision]"
]
all = [
    "ccf[plots,symbolic,precision]"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ccf*"]

[tool.pytest.ini_options]
testpaths = ["tests", "ccf"]
addopts = "--doctest-modules"
pythonpath = ["."]
