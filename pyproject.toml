[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccf"
version = "0.1.0"
description = "Companion code for Schur/PACF coordinates of constrained correlation functions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Thomas Erben" }
]
dependencies = [
    "numpy"
]

[project.optional-dependencies]
plots = [
    "matplotlib",
    "scipy"
]
symbolic = [
    "sympy"
]
precision = [
    "mpmath"
]
test = [
    "pytest",
    "statsmodels",
    "ccf[plots,symbolic,precision]"
]
all = [
    "ccf[plots,symbolic,precision]"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ccf*"]

[tool.pytest.ini_options]
testpaths = ["tests", "ccf"]
addopts = "--doctest-modules"
pythonpath = ["."]
